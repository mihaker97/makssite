<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Макс ♥ Настя</title>
  <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14102e">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Макс ♥ Настя">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  @property --a { syntax: "<angle>"; initial-value: 0deg; inherits: false; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { overflow: hidden; color: #fff; background: #0d0b1f; font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; }

  .aurora {
    position: fixed; inset: 0; z-index: 0;
    background:
      radial-gradient(60vmax 60vmax at 15% 20%, rgba(255,105,160,.55), transparent 60%),
      radial-gradient(55vmax 55vmax at 85% 25%, rgba(108,140,255,.50), transparent 60%),
      radial-gradient(60vmax 60vmax at 60% 90%, rgba(181,123,255,.55), transparent 60%),
      linear-gradient(135deg, #14102e, #2a1650, #4a1f5e);
    background-size: 140% 140%, 140% 140%, 140% 140%, 100% 100%;
    animation: drift 22s ease-in-out infinite alternate;
  }
  @keyframes drift {
    0%   { background-position: 0% 0%, 100% 0%, 50% 100%, 0 0; filter: hue-rotate(0deg); }
    100% { background-position: 40% 30%, 60% 40%, 20% 70%, 0 0; filter: hue-rotate(25deg); }
  }
  canvas { position: fixed; inset: 0; z-index: 1; }
  .glow {
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background: radial-gradient(320px circle at var(--mx, 50%) var(--my, 50%), rgba(255,170,205,.22), transparent 70%);
  }

  /* две «страницы» */
  .view {
    position: fixed; inset: 0; z-index: 3; padding: 1.2rem;
    display: flex; align-items: center; justify-content: center; perspective: 1000px;
    opacity: 0; visibility: hidden; transition: opacity .5s, visibility 0s .5s;
  }
  .view.active { opacity: 1; visibility: visible; transition: opacity .6s; }
  .tilt { transition: transform .15s ease-out; transform-style: preserve-3d; }

  .card {
    position: relative; text-align: center; border-radius: 32px;
    padding: clamp(2rem, 6vw, 4.2rem) clamp(1.6rem, 6vw, 5rem);
    background: rgba(255,255,255,.07);
    backdrop-filter: blur(18px) saturate(140%); -webkit-backdrop-filter: blur(18px) saturate(140%);
    box-shadow: 0 30px 80px rgba(0,0,0,.35), inset 0 0 40px rgba(255,255,255,.04);
  }
  .card::before {
    content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1.5px; pointer-events: none;
    background: conic-gradient(from var(--a), transparent 0 55%, #ff8fb1 75%, #ffd1a0 85%, #b57bff 95%, transparent);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
            mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
    animation: spin 6s linear infinite;
  }
  @keyframes spin { to { --a: 360deg; } }
  #home .card { opacity: 0; transform: translateY(30px) scale(.94); animation: cardIn 1.4s cubic-bezier(.2,.8,.2,1) .1s forwards; }
  @keyframes cardIn { to { opacity: 1; transform: none; } }

  /* ---- страница 1: текст ---- */
  h1 { margin: 0; font-weight: 300; font-size: clamp(2rem, 8vw, 4.6rem); line-height: 1.3; letter-spacing: .02em; }
  .line { display: block; }
  .word { display: inline-block; white-space: nowrap; margin: 0 .14em; }
  .ch {
    display: inline-block; opacity: 0; filter: blur(12px);
    transform: translateY(40px) rotateX(-70deg) scale(.7);
    animation: letterIn 1s cubic-bezier(.2,.8,.2,1) var(--d) forwards;
    text-shadow: 0 4px 30px rgba(0,0,0,.25);
  }
  @keyframes letterIn { 60% { filter: blur(2px); } to { opacity: 1; transform: none; filter: blur(0); } }
  .name .ch {
    font-weight: 700;
    animation: letterIn 1s cubic-bezier(.2,.8,.2,1) var(--d) forwards, wave 3.6s ease-in-out var(--w) infinite;
  }
  @keyframes wave {
    0%, 100% { color: #ffd6e6; text-shadow: 0 0 10px rgba(255,143,177,.5), 0 0 30px rgba(255,143,177,.3); transform: translateY(0); }
    50%      { color: #ff7fa8; text-shadow: 0 0 18px rgba(255,105,160,.9), 0 0 50px rgba(255,105,160,.55); transform: translateY(-4px); }
  }
  .hint {
    position: fixed; bottom: calc(1.4rem + env(safe-area-inset-bottom)); left: 0; right: 0; text-align: center;
    font-size: .95rem; letter-spacing: .08em; color: rgba(255,255,255,.6); opacity: 0; pointer-events: none;
  }
  .hint.show { animation: fadeIn 1.5s ease forwards; }
  @keyframes fadeIn { to { opacity: 1; } }

  /* ---- стрелки ---- */
  .nav {
    position: fixed; top: 50%; right: clamp(.8rem, 3vw, 2.2rem); width: 58px; height: 58px; margin-top: -29px;
    display: grid; place-items: center; border-radius: 50%; cursor: pointer; color: #fff; padding: 0;
    border: 1px solid rgba(255,255,255,.3); background: rgba(255,255,255,.1);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    opacity: 0; pointer-events: none; transform: scale(.7);
    transition: opacity .8s, transform .8s cubic-bezier(.2,.8,.2,1), background .3s, box-shadow .3s;
  }
  .nav.left { right: auto; left: clamp(.8rem, 3vw, 2.2rem); }
  .nav.show { opacity: 1; pointer-events: auto; transform: none; }
  .nav:hover { background: rgba(255,255,255,.2); box-shadow: 0 0 35px rgba(255,143,177,.55); transform: scale(1.08); }
  .nav svg { width: 26px; height: 26px; animation: nudge 1.8s ease-in-out infinite; }
  .nav.left svg { animation-name: nudgeL; }
  .nav::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 1px solid rgba(255,170,205,.6); animation: ring 2.2s ease-out infinite; }
  @keyframes nudge  { 50% { transform: translateX(5px); } }
  @keyframes nudgeL { 50% { transform: translateX(-5px); } }
  @keyframes ring   { from { transform: scale(1); opacity: .8; } to { transform: scale(1.8); opacity: 0; } }
  @media (max-width: 600px) {
    .nav { top: auto; bottom: calc(1.2rem + env(safe-area-inset-bottom)); margin-top: 0; right: 1.2rem; width: 50px; height: 50px; }
    .nav.left { right: auto; left: 1.2rem; }
  }

  /* ---- страница 2: счётчик ---- */
  #days .card { min-width: min(88vw, 520px); }
  .view.active .enter { animation: up .9s cubic-bezier(.2,.8,.2,1) calc(.35s + var(--i) * .12s) both; }
  @keyframes up { from { opacity: 0; transform: translateY(24px); filter: blur(8px); } }
  .beat { display: inline-block; font-size: 2.4rem; color: #ff7fa8; text-shadow: 0 0 25px rgba(255,105,160,.8); animation: beat 1.3s ease-in-out infinite; }
  @keyframes beat { 0%, 100% { transform: scale(1); } 15% { transform: scale(1.25); } 30% { transform: scale(1); } 45% { transform: scale(1.18); } }
  .cap { margin: .4rem 0 .2rem; font-size: clamp(1rem, 3.4vw, 1.4rem); font-weight: 300; letter-spacing: .35em; text-transform: uppercase; color: rgba(255,255,255,.8); }
  .num {
    display: inline-block; font-size: clamp(4.5rem, 21vw, 9.5rem); font-weight: 700; line-height: 1.05; font-variant-numeric: tabular-nums;
    background: linear-gradient(90deg, #ffd1e3, #ff8fb1, #ffc3a0, #ff8fb1, #ffd1e3); background-size: 250% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 25px rgba(255,105,160,.45)); animation: shine 5s linear infinite;
  }
  @keyframes shine { to { background-position: 250% 0; } }
  .unit { font-size: clamp(1.5rem, 5vw, 2.4rem); font-weight: 300; letter-spacing: .08em; }
  .sub { margin-top: .6rem; min-height: 1.4em; font-size: clamp(.95rem, 3vw, 1.2rem); color: rgba(255,255,255,.75); }
  .hr { height: 1px; margin: 1.6rem auto 1.2rem; width: 60%; background: linear-gradient(90deg, transparent, rgba(255,255,255,.4), transparent); }
  .since { font-size: 1rem; letter-spacing: .06em; color: rgba(255,255,255,.7); }
  .next { margin-top: .5rem; font-size: .9rem; color: rgba(255,255,255,.55); }
  .next b { font-weight: 600; color: #ffc3d8; font-variant-numeric: tabular-nums; }

  /* ---- переход ---- */
  .wipe {
    position: fixed; inset: 0; z-index: 10; pointer-events: none; display: grid; place-items: center;
    clip-path: circle(0px at 50% 50%); background: linear-gradient(135deg, #ff6f9f, #b57bff 55%, #6c8cff);
  }
  .wipe span { font-size: clamp(4rem, 16vw, 8rem); text-shadow: 0 0 40px rgba(255,255,255,.7); animation: beat .9s ease-in-out infinite; }

  /* сердечки */
  .heart { position: fixed; z-index: 2; pointer-events: none; left: var(--x); top: var(--y); font-size: var(--s); color: var(--c); text-shadow: 0 0 12px currentColor; opacity: 0; animation: rise var(--t) ease-in forwards; }
  .heart.burst { z-index: 4; animation: burst var(--t) cubic-bezier(.1,.7,.3,1) forwards; }
  @keyframes rise { 0% { transform: translate(0,0) scale(.6); opacity: 0; } 12% { opacity: .85; } 100% { transform: translate(var(--dx), -115vh) rotate(var(--r)) scale(1.1); opacity: 0; } }
  @keyframes burst { 0% { transform: translate(0,0) scale(.3); opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)) rotate(var(--r)) scale(1); opacity: 0; } }

  @media (prefers-reduced-motion: reduce) {
    .aurora, .card::before, .name .ch, .num, .beat, .nav svg, .nav::after { animation: none; }
    #home .card, .ch, .hint, .view.active .enter { animation: none; opacity: 1; transform: none; filter: none; }
    canvas, .heart { display: none; }
  }
</style>
</head>
<body>
  <div class="aurora"></div>
  <canvas id="stars"></canvas>
  <div class="glow"></div>

  <!-- страница 1 -->
  <section class="view active" id="home">
    <div class="tilt" id="tilt">
      <div class="card"><h1 id="title" aria-label="Я Макс и я люблю Настю"></h1></div>
    </div>
    <div class="hint" id="hint">нажми куда-нибудь ♥</div>
    <button class="nav" id="next" aria-label="Дальше">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
    </button>
  </section>

  <!-- страница 2 -->
  <section class="view" id="days">
    <button class="nav left show" id="back" aria-label="Назад">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
        <button class="nav show" id="toGallery" aria-label="Фото">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
    </button>
    <div class="card">
      <div class="enter" style="--i:0"><span class="beat">♥</span></div>
      <div class="cap enter" style="--i:1">Мы вместе</div>
      <div class="enter" style="--i:2"><span class="num" id="num">0</span></div>
      <div class="unit enter" style="--i:3" id="unit">дней</div>
      <div class="sub enter" style="--i:4" id="sub"></div>
      <div class="hr enter" style="--i:5"></div>
      <div class="since enter" style="--i:6" id="since"></div>
      <div class="next enter" style="--i:7">новый день через <b id="cd">00:00:00</b></div>
    </div>
  </section>

  <div class="wipe" id="wipe"><span>♥</span></div>

<script>
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const rnd = (a, b) => Math.random() * (b - a) + a;

  /* ---------- настройки счётчика ---------- */
  const START  = { y: 2024, m: 11, d: 15 };  // дата начала
  const OFFSET = 0;  // 0: в сам день 15 ноября будет 0 дней. Поставь 1, если этот день считать первым
  const MONTHS = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];

  /* ---------- текст на первой странице: по порядку, буква за буквой ---------- */
  const lines = [
    [{ t: "Я" }, { t: "Макс", name: 1 }],
    [{ t: "и" }, { t: "я" }, { t: "люблю" }, { t: "Настю", name: 1 }]
  ];
  const title = document.getElementById("title");
  let time = 0.9, idx = 0;
  lines.forEach(line => {
    const l = document.createElement("span"); l.className = "line";
    line.forEach(w => {
      const we = document.createElement("span");
      we.className = "word" + (w.name ? " name" : ""); we.setAttribute("aria-hidden", "true");
      [...w.t].forEach(ch => {
        const c = document.createElement("span"); c.className = "ch"; c.textContent = ch;
        c.style.setProperty("--d", time.toFixed(2) + "s");
        c.style.setProperty("--w", (time + 1 + idx * 0.12).toFixed(2) + "s");
        we.appendChild(c); time += 0.07; idx++;
      });
      time += 0.28; l.appendChild(we);
    });
    title.appendChild(l);
  });
  const next = document.getElementById("next"), back = document.getElementById("back");
  setTimeout(() => document.getElementById("hint").classList.add("show"), (time + .6) * 1000);
  setTimeout(() => next.classList.add("show"), (time + .4) * 1000);

  /* ---------- время по Киеву ---------- */
  let TZ = "Europe/Kyiv";
  try { new Intl.DateTimeFormat("en", { timeZone: TZ }); } catch (e) { TZ = "Europe/Kiev"; }
  const fmt = new Intl.DateTimeFormat("en-GB", { timeZone: TZ, year: "numeric", month: "numeric", day: "numeric", hour: "numeric", minute: "numeric", second: "numeric", hourCycle: "h23" });
  function kyiv() {
    const o = {};
    for (const p of fmt.formatToParts(new Date())) if (p.type !== "literal") o[p.type] = +p.value;
    o.hour %= 24; return o;
  }
  const dayNum = (y, m, d) => Date.UTC(y, m - 1, d) / 86400000;
  const daysSince = n => Math.max(0, dayNum(n.year, n.month, n.day) - dayNum(START.y, START.m, START.d) + OFFSET);
  function ymd(n) {
    let y = n.year - START.y, m = n.month - START.m, d = n.day - START.d;
    if (d < 0) { m--; d += new Date(Date.UTC(n.year, n.month - 1, 0)).getUTCDate(); }
    if (m < 0) { y--; m += 12; }
    return { y, m, d };
  }
  function plural(n, one, few, many) {
    const a = n % 100, b = n % 10;
    if (a > 10 && a < 20) return many;
    if (b === 1) return one;
    return b > 1 && b < 5 ? few : many;
  }

  const numEl = document.getElementById("num"), unitEl = document.getElementById("unit"),
        subEl = document.getElementById("sub"), cdEl = document.getElementById("cd");
  document.getElementById("since").textContent = "с " + START.d + " " + MONTHS[START.m - 1] + " " + START.y;
  let counting = false, shown = -1;

  function renderStatic(n, d) {
    unitEl.textContent = plural(d, "день", "дня", "дней");
    const p = ymd(n), out = [];
    if (p.y) out.push(p.y + " " + plural(p.y, "год", "года", "лет"));
    if (p.m) out.push(p.m + " " + plural(p.m, "месяц", "месяца", "месяцев"));
    if (p.d) out.push(p.d + " " + plural(p.d, "день", "дня", "дней"));
    subEl.textContent = out.join(" · ");
  }
  function tick() {
    const n = kyiv(), d = daysSince(n);
    if (d !== shown) { shown = d; renderStatic(n, d); if (!counting) numEl.textContent = d; }  // в 00:00 по Киеву число меняется само
    const left = 86400 - (n.hour * 3600 + n.minute * 60 + n.second);
    cdEl.textContent = [Math.floor(left / 3600), Math.floor(left / 60) % 60, left % 60].map(v => String(v).padStart(2, "0")).join(":");
  }
  tick(); setInterval(tick, 1000);

  function runCount() {
    if (reduce) { numEl.textContent = shown; return; }
    counting = true; numEl.textContent = 0;
    setTimeout(() => {
      const t0 = performance.now(), dur = 2200;
      const step = now => {
        const p = Math.min(1, (now - t0) / dur);
        numEl.textContent = Math.round(shown * (1 - Math.pow(1 - p, 4)));
        if (p < 1) requestAnimationFrame(step); else { counting = false; numEl.textContent = shown; }
      };
      requestAnimationFrame(step);
    }, 600);
  }

  /* ---------- переход между страницами ---------- */
  const home = document.getElementById("home"), daysV = document.getElementById("days"), wipe = document.getElementById("wipe");
  let current = "home", busy = false;
  function setView(to) {
    current = to;
    home.classList.toggle("active", to === "home");
    daysV.classList.toggle("active", to === "days");
    if (to === "days") runCount();
  }
  async function go(to, ox = innerWidth / 2, oy = innerHeight / 2, push = true) {
    if (busy || to === current) return;
    if (push) { try { history.pushState(null, "", "#" + to); } catch (e) {} }
    if (reduce || !wipe.animate) { setView(to); return; }
    busy = true;
    const R = Math.hypot(Math.max(ox, innerWidth - ox), Math.max(oy, innerHeight - oy)) + 30;
    await wipe.animate(
      [{ clipPath: "circle(0px at " + ox + "px " + oy + "px)" }, { clipPath: "circle(" + R + "px at " + ox + "px " + oy + "px)" }],
      { duration: 800, easing: "cubic-bezier(.7,0,.25,1)", fill: "forwards" }).finished;
    setView(to);
    await wipe.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 700, delay: 250, easing: "ease", fill: "forwards" }).finished;
    wipe.getAnimations().forEach(a => a.cancel());
    busy = false;
  }
  const ctr = el => { const r = el.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; };
  next.addEventListener("click", () => go("days", ...ctr(next)));
  back.addEventListener("click", () => go("home", ...ctr(back)));
    const toGallery = document.getElementById("toGallery");
  toGallery.addEventListener("click", async () => {
    if (reduce || !wipe.animate) { location.href = "gallery.html"; return; }
    const [x, y] = ctr(toGallery);
    const R = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y)) + 30;
    await wipe.animate(
      [{ clipPath: "circle(0px at " + x + "px " + y + "px)" }, { clipPath: "circle(" + R + "px at " + x + "px " + y + "px)" }],
      { duration: 800, easing: "cubic-bezier(.7,0,.25,1)", fill: "forwards" }).finished;
    location.href = "gallery.html";
  });
  addEventListener("keydown", e => {
    if (e.key === "ArrowRight") go("days", innerWidth - 50, innerHeight / 2);
    if (e.key === "ArrowLeft") go("home", 50, innerHeight / 2);
  });
  addEventListener("popstate", () => go(location.hash === "#days" ? "days" : "home", undefined, undefined, false));
  let sx = null, sy = null;
  addEventListener("touchstart", e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
  addEventListener("touchend", e => {
    if (sx === null) return;
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy; sx = null;
    if (Math.abs(dx) < 70 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
    dx < 0 ? go("days", innerWidth, innerHeight / 2) : go("home", 0, innerHeight / 2);
  }, { passive: true });
  if (location.hash === "#days") setView("days");

  /* ---------- звёзды ---------- */
  const cv = document.getElementById("stars"), ctx = cv.getContext("2d");
  let W, H, pts = [];
  const mouse = { x: -9999, y: -9999 };
  function resize() {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr; cv.style.width = W + "px"; cv.style.height = H + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    pts = Array.from({ length: Math.min(110, Math.floor(W * H / 14000)) }, () => ({
      x: Math.random() * W, y: Math.random() * H, vx: rnd(-.18, .18), vy: rnd(-.18, .18), r: rnd(.6, 2.2)
    }));
  }
  addEventListener("resize", resize); resize();
  function frame() {
    ctx.clearRect(0, 0, W, H);
    for (const p of pts) {
      const dx = p.x - mouse.x, dy = p.y - mouse.y, d2 = dx * dx + dy * dy;
      if (d2 < 14000) { const f = (1 - d2 / 14000) * .08 / Math.sqrt(d2 + 1); p.vx += dx * f; p.vy += dy * f; }
      p.vx *= .99; p.vy *= .99; p.x += p.vx; p.y += p.vy;
      if (p.x < 0) p.x = W; if (p.x > W) p.x = 0; if (p.y < 0) p.y = H; if (p.y > H) p.y = 0;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fillStyle = "rgba(255,255,255,.8)"; ctx.fill();
    }
    for (let i = 0; i < pts.length; i++) for (let j = i + 1; j < pts.length; j++) {
      const a = pts[i], b = pts[j], d = Math.hypot(a.x - b.x, a.y - b.y);
      if (d < 110) {
        ctx.strokeStyle = "rgba(255,170,210," + (0.18 * (1 - d / 110)) + ")";
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      }
    }
    requestAnimationFrame(frame);
  }
  if (!reduce) frame();

  /* ---------- наклон карточки и свет за курсором ---------- */
  const tilt = document.getElementById("tilt"), glow = document.querySelector(".glow");
  addEventListener("pointermove", e => {
    mouse.x = e.clientX; mouse.y = e.clientY;
    glow.style.setProperty("--mx", e.clientX + "px"); glow.style.setProperty("--my", e.clientY + "px");
    tilt.style.transform = "rotateY(" + ((e.clientX / innerWidth - .5) * 10) + "deg) rotateX(" + (-(e.clientY / innerHeight - .5) * 10) + "deg)";
  });
  addEventListener("pointerleave", () => { mouse.x = mouse.y = -9999; tilt.style.transform = ""; });

  /* ---------- сердечки ---------- */
  const colors = ["#ff8fb1", "#ff6f9f", "#ffb3c9", "#ffc3a0", "#d9a0ff"];
  function heart(o) {
    const h = document.createElement("span");
    h.className = "heart" + (o.burst ? " burst" : ""); h.textContent = "♥";
    h.style.setProperty("--x", o.x + "px"); h.style.setProperty("--y", o.y + "px");
    h.style.setProperty("--s", rnd(12, o.burst ? 34 : 30) + "px");
    h.style.setProperty("--c", colors[Math.floor(Math.random() * colors.length)]);
    h.style.setProperty("--t", (o.burst ? rnd(1, 1.6) : rnd(7, 13)) + "s");
    h.style.setProperty("--dx", o.dx + "px"); h.style.setProperty("--dy", (o.dy || 0) + "px");
    h.style.setProperty("--r", rnd(-40, 40) + "deg");
    h.addEventListener("animationend", () => h.remove());
    document.body.appendChild(h);
  }
  if (!reduce) {
    setInterval(() => { if (!document.hidden) heart({ x: rnd(0, innerWidth), y: innerHeight + 20, dx: rnd(-60, 60) }); }, 900);
    addEventListener("pointerdown", e => {
      if (e.target.closest(".nav")) return;
      for (let i = 0; i < 14; i++) {
        const ang = rnd(0, 6.283), dist = rnd(60, 180);
        heart({ burst: 1, x: e.clientX, y: e.clientY, dx: Math.cos(ang) * dist, dy: Math.sin(ang) * dist });
      }
    });
  }
</script>
</body>
</html>
