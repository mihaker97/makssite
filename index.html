<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Макс</title>
<style>
  * { box-sizing: border-box; }

  html, body { height: 100%; margin: 0; }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 1.5rem;
    overflow: hidden;
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    color: #fff;
    background: linear-gradient(120deg, #1d1b3a, #3b2a6b, #7a3b86, #c25a7c, #3b2a6b);
    background-size: 300% 300%;
    animation: bgShift 18s ease-in-out infinite;
  }

  /* мягкие светящиеся пятна на фоне */
  .blob {
    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.45;
    z-index: 0;
    animation: float 14s ease-in-out infinite;
  }
  .b1 { width: 40vmax; height: 40vmax; background: #ff8fb1; top: -10vmax; left: -10vmax; }
  .b2 { width: 35vmax; height: 35vmax; background: #6c8cff; bottom: -12vmax; right: -8vmax; animation-delay: -5s; }
  .b3 { width: 25vmax; height: 25vmax; background: #b57bff; top: 40%; left: 55%; animation-delay: -9s; }

  h1 {
    position: relative;
    z-index: 1;
    margin: 0;
    font-weight: 300;
    font-size: clamp(2rem, 7vw, 4.5rem);
    line-height: 1.25;
    letter-spacing: 0.02em;
    text-shadow: 0 4px 30px rgba(0, 0, 0, 0.25);
  }

  .line { display: block; }

  .word {
    display: inline-block;
    opacity: 0;
    transform: translateY(24px);
    filter: blur(10px);
    animation: appear 1.2s cubic-bezier(.2, .7, .2, 1) forwards;
  }
  .w1 { animation-delay: 0.4s; }
  .w2 { animation-delay: 1.0s; }
  .w3 { animation-delay: 1.6s; }
  .w4 { animation-delay: 2.2s; }
  .w5 { animation-delay: 2.8s; }

  /* имя с переливающимся градиентом */
  .name {
    font-weight: 600;
    background: linear-gradient(90deg, #ffd1e3, #ff8fb1, #ffc3a0, #ff8fb1, #ffd1e3);
    background-size: 250% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: appear 1.2s cubic-bezier(.2, .7, .2, 1) 2.8s forwards,
               shine 5s linear 4s infinite;
  }

  @keyframes appear {
    to { opacity: 1; transform: translateY(0); filter: blur(0); }
  }
  @keyframes shine {
    to { background-position: 250% 0; }
  }
  @keyframes bgShift {
    0%, 100% { background-position: 0% 50%; }
    50%      { background-position: 100% 50%; }
  }
  @keyframes float {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50%      { transform: translate(4vmax, -3vmax) scale(1.1); }
  }

  /* для тех, у кого отключены анимации в системе */
  @media (prefers-reduced-motion: reduce) {
    body, .blob, .name { animation: none; }
    .word { animation: none; opacity: 1; transform: none; filter: none; }
  }
</style>
</head>
<body>
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>

  <h1>
    <span class="line">
      <span class="word w1">Я</span>
      <span class="word w2 name">Макс</span>
    </span>
    <span class="line">
      <span class="word w3">и</span>
      <span class="word w4">я</span>
      <span class="word w4">люблю</span>
      <span class="word w5 name">Настю</span>
    </span>
  </h1>
</body>
</html>
