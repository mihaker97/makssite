<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Макс ♥ Настя</title>
<style>
  @property --a { syntax: "<angle>"; initial-value: 0deg; inherits: false; }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }

  body {
    overflow: hidden;
    color: #fff;
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    background: #0d0b1f;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }

  /* переливающийся фон-аврора */
  .aurora {
    position: fixed; inset: 0; z-index: 0;
    background:
      radial-gradient(60vmax 60vmax at 15% 20%, rgba(255, 105, 160, .55), transparent 60%),
      radial-gradient(55vmax 55vmax at 85% 25%, rgba(108, 140, 255, .50), transparent 60%),
      radial-gradient(60vmax 60vmax at 60% 90%, rgba(181, 123, 255, .55), transparent 60%),
      linear-gradient(135deg, #14102e, #2a1650, #4a1f5e);
    background-size: 140% 140%, 140% 140%, 140% 140%, 100% 100%;
    animation: drift 22s ease-in-out infinite alternate;
  }
  @keyframes drift {
    0%   { background-position: 0% 0%, 100% 0%, 50% 100%, 0 0; filter: hue-rotate(0deg); }
    100% { background-position: 40% 30%, 60% 40%, 20% 70%, 0 0; filter: hue-rotate(25deg); }
  }

  canvas { position: fixed; inset: 0; z-index: 1; }

  /* свет, следующий за курсором */
  .glow {
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background: radial-gradient(320px circle at var(--mx, 50%) var(--my, 50%), rgba(255, 170, 205, .22), transparent 70%);
  }

  .scene {
    position: fixed; inset: 0; z-index: 3;
    display: flex; align-items: center; justify-content: center;
    padding: 1.2rem;
    perspective: 1000px;
  }
  .tilt { transition: transform .15s ease-out; transform-style: preserve-3d; }

  /* стеклянная карточка с вращающейся светящейся рамкой */
  .card {
    position: relative;
    padding: clamp(2rem, 6vw, 4.2rem) clamp(1.6rem, 6vw, 5rem);
    border-radius: 32px;
    text-align: center;
    background: rgba(255, 255, 255, .07);
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    box-shadow: 0 30px 80px rgba(0, 0, 0, .35), inset 0 0 40px rgba(255, 255, 255, .04);
    opacity: 0; transform: translateY(30px) scale(.94);
    animation: cardIn 1.4s cubic-bezier(.2, .8, .2, 1) .1s forwards;
  }
  .card::before {
    content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1.5px;
    background: conic-gradient(from var(--a), transparent 0 55%, #ff8fb1 75%, #ffd1a0 85%, #b57bff 95%, transparent);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
            mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
    animation: spin 6s linear infinite;
    pointer-events: none;
  }
  @keyframes spin { to { --a: 360deg; } }
  @keyframes cardIn { to { opacity: 1; transform: none; } }

  h1 {
    margin: 0;
    font-weight: 300;
    font-size: clamp(2rem, 8vw, 4.6rem);
    line-height: 1.3;
    letter-spacing: .02em;
  }
  .line { display: block; }
  .word { display: inline-block; white-space: nowrap; margin: 0 .14em; }

  .ch {
    display: inline-block;
    opacity: 0;
    transform: translateY(40px) rotateX(-70deg) scale(.7);
    filter: blur(12px);
    animation: letterIn 1s cubic-bezier(.2, .8, .2, 1) var(--d) forwards;
    text-shadow: 0 4px 30px rgba(0, 0, 0, .25);
  }
  @keyframes letterIn {
    60% { filter: blur(2px); }
    to  { opacity: 1; transform: none; filter: blur(0); }
  }

  /* имена: жирнее, светятся и переливаются волной по буквам */
  .name .ch {
    font-weight: 700;
    animation:
      letterIn 1s cubic-bezier(.2, .8, .2, 1) var(--d) forwards,
      wave 3.6s ease-in-out var(--w) infinite;
  }
  @keyframes wave {
    0%, 100% { color: #ffd6e6; text-shadow: 0 0 10px rgba(255, 143, 177, .5), 0 0 30px rgba(255, 143, 177, .3); transform: translateY(0); }
    50%      { color: #ff7fa8; text-shadow: 0 0 18px rgba(255, 105, 160, .9), 0 0 50px rgba(255, 105, 160, .55); transform: translateY(-4px); }
  }

  .hint {
    position: fixed; bottom: calc(1.4rem + env(safe-area-inset-bottom)); left: 0; right: 0;
    z-index: 3; text-align: center; font-size: .95rem; letter-spacing: .08em;
    color: rgba(255, 255, 255, .6); opacity: 0; pointer-events: none;
  }
  .hint.show { animation: hint 1.5s ease forwards; }
  @keyframes hint { to { opacity: 1; } }

  /* сердечки */
  .heart {
    position: fixed; z-index: 2; pointer-events: none;
    left: var(--x); top: var(--y); font-size: var(--s); color: var(--c);
    text-shadow: 0 0 12px currentColor; opacity: 0;
    animation: rise var(--t) ease-in forwards;
  }
  .heart.burst { z-index: 4; animation: burst var(--t) cubic-bezier(.1, .7, .3, 1) forwards; }
  @keyframes rise {
    0%   { transform: translate(0, 0) scale(.6); opacity: 0; }
    12%  { opacity: .85; }
    100% { transform: translate(var(--dx), -115vh) rotate(var(--r)) scale(1.1); opacity: 0; }
  }
  @keyframes burst {
    0%   { transform: translate(0, 0) scale(.3); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) rotate(var(--r)) scale(1); opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    .aurora, .card::before, .name .ch { animation: none; }
    .card, .ch, .hint { animation: none; opacity: 1; transform: none; filter: none; }
    canvas, .heart { display: none; }
  }
</style>
</head>
<body>
  <div class="aurora"></div>
  <canvas id="stars"></canvas>
  <div class="glow"></div>

  <div class="scene">
    <div class="tilt" id="tilt">
      <div class="card">
        <h1 id="title" aria-label="Я Макс и я люблю Настю"></h1>
      </div>
    </div>
  </div>

  <div class="hint" id="hint">нажми куда-нибудь ♥</div>

<script>
  /* ---------- текст: строго по очереди, буква за буквой ---------- */
  const lines = [
    [{ t: "Я" }, { t: "Макс", name: true }],
    [{ t: "и" }, { t: "я" }, { t: "люблю" }, { t: "Настю", name: true }]
  ];
  const title = document.getElementById("title");
  let time = 0.9;          // когда начинается первое слово
  const STEP = 0.07;       // пауза между буквами
  const WORD_GAP = 0.28;   // пауза между словами
  let letterIndex = 0;

  lines.forEach(line => {
    const lineEl = document.createElement("span");
    lineEl.className = "line";
    line.forEach(w => {
      const wordEl = document.createElement("span");
      wordEl.className = "word" + (w.name ? " name" : "");
      wordEl.setAttribute("aria-hidden", "true");
      [...w.t].forEach(ch => {
        const c = document.createElement("span");
        c.className = "ch";
        c.textContent = ch;
        c.style.setProperty("--d", time.toFixed(2) + "s");
        c.style.setProperty("--w", (time + 1 + letterIndex * 0.12).toFixed(2) + "s");
        wordEl.appendChild(c);
        time += STEP;
        letterIndex++;
      });
      time += WORD_GAP;
      lineEl.appendChild(wordEl);
    });
    title.appendChild(lineEl);
  });

  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  setTimeout(() => document.getElementById("hint").classList.add("show"), (time + 0.6) * 1000);

  /* ---------- звёзды-частицы, которые тянутся друг к другу ---------- */
  const cv = document.getElementById("stars");
  const ctx = cv.getContext("2d");
  let W, H, DPR, pts = [];
  const mouse = { x: -9999, y: -9999 };

  function resize() {
    DPR = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W * DPR; cv.height = H * DPR;
    cv.style.width = W + "px"; cv.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const n = Math.min(110, Math.floor(W * H / 14000));
    pts = Array.from({ length: n }, () => ({
      x: Math.random() * W, y: Math.random() * H,
      vx: (Math.random() - .5) * .35, vy: (Math.random() - .5) * .35,
      r: Math.random() * 1.6 + .6
    }));
  }
  addEventListener("resize", resize);
  resize();

  function frame() {
    ctx.clearRect(0, 0, W, H);
    for (const p of pts) {
      const dx = p.x - mouse.x, dy = p.y - mouse.y, d2 = dx * dx + dy * dy;
      if (d2 < 14000) { const f = (1 - d2 / 14000) * .9; p.vx += dx / Math.sqrt(d2 + 1) * f * .08; p.vy += dy / Math.sqrt(d2 + 1) * f * .08; }
      p.vx *= .99; p.vy *= .99;
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0) p.x = W; if (p.x > W) p.x = 0;
      if (p.y < 0) p.y = H; if (p.y > H) p.y = 0;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, 6.283);
      ctx.fillStyle = "rgba(255,255,255,.8)";
      ctx.fill();
    }
    for (let i = 0; i < pts.length; i++) {
      for (let j = i + 1; j < pts.length; j++) {
        const a = pts[i], b = pts[j];
        const d = Math.hypot(a.x - b.x, a.y - b.y);
        if (d < 110) {
          ctx.strokeStyle = "rgba(255,170,210," + (0.18 * (1 - d / 110)) + ")";
          ctx.lineWidth = 1;
          ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
        }
      }
    }
    requestAnimationFrame(frame);
  }
  if (!reduce) frame();

  /* ---------- наклон карточки и свет за курсором ---------- */
  const tilt = document.getElementById("tilt");
  const glow = document.querySelector(".glow");
  function onMove(x, y) {
    mouse.x = x; mouse.y = y;
    glow.style.setProperty("--mx", x + "px");
    glow.style.setProperty("--my", y + "px");
    const nx = x / innerWidth - .5, ny = y / innerHeight - .5;
    tilt.style.transform = "rotateY(" + (nx * 10) + "deg) rotateX(" + (-ny * 10) + "deg)";
  }
  addEventListener("pointermove", e => onMove(e.clientX, e.clientY));
  addEventListener("pointerleave", () => { mouse.x = mouse.y = -9999; tilt.style.transform = ""; });

  /* ---------- сердечки ---------- */
  const colors = ["#ff8fb1", "#ff6f9f", "#ffb3c9", "#ffc3a0", "#d9a0ff"];
  const rnd = (a, b) => Math.random() * (b - a) + a;

  function heart(opts) {
    const h = document.createElement("span");
    h.className = "heart" + (opts.burst ? " burst" : "");
    h.textContent = "♥";
    h.style.setProperty("--x", opts.x + "px");
    h.style.setProperty("--y", opts.y + "px");
    h.style.setProperty("--s", rnd(opts.burst ? 14 : 12, opts.burst ? 34 : 30) + "px");
    h.style.setProperty("--c", colors[Math.floor(Math.random() * colors.length)]);
    h.style.setProperty("--t", rnd(opts.burst ? 1 : 7, opts.burst ? 1.6 : 13) + "s");
    h.style.setProperty("--dx", opts.dx + "px");
    h.style.setProperty("--dy", (opts.dy || 0) + "px");
    h.style.setProperty("--r", rnd(-40, 40) + "deg");
    h.addEventListener("animationend", () => h.remove());
    document.body.appendChild(h);
  }

  if (!reduce) {
    setInterval(() => {
      if (document.hidden) return;
      heart({ x: rnd(0, innerWidth), y: innerHeight + 20, dx: rnd(-60, 60) });
    }, 900);

    addEventListener("pointerdown", e => {
      for (let i = 0; i < 14; i++) {
        const ang = rnd(0, 6.283), dist = rnd(60, 180);
        heart({ burst: true, x: e.clientX, y: e.clientY, dx: Math.cos(ang) * dist, dy: Math.sin(ang) * dist });
      }
    });
  }
</script>
</body>
</html>
