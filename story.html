<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Два года ♥</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14102e">
<style>
  @property --a { syntax: "<angle>"; initial-value: 0deg; inherits: false; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; min-height: 100%; }
  body { color: #fff; background: #0d0b1f; font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; }
  .aurora {
    position: fixed; inset: 0; z-index: 0;
    background:
      radial-gradient(60vmax 60vmax at 15% 20%, rgba(255,105,160,.55), transparent 60%),
      radial-gradient(55vmax 55vmax at 85% 25%, rgba(108,140,255,.5), transparent 60%),
      radial-gradient(60vmax 60vmax at 60% 90%, rgba(181,123,255,.55), transparent 60%),
      linear-gradient(135deg, #14102e, #2a1650, #4a1f5e);
  }
  main { position: relative; z-index: 2; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.4rem 1.2rem calc(1.4rem + env(safe-area-inset-bottom)); }
  .bar { position: fixed; top: 0; left: 0; right: 0; z-index: 5; height: 4px; background: rgba(255,255,255,.12); }
  .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #ff8fb1, #b57bff); transition: width .6s; }
  .card {
    position: relative; width: min(100%, 560px); border-radius: 28px; padding: 1.6rem; text-align: center;
    background: rgba(255,255,255,.07); box-shadow: 0 30px 80px rgba(0,0,0,.35);
  }
  .card::before {
    content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1.5px; pointer-events: none;
    background: conic-gradient(from var(--a), transparent 0 55%, #ff8fb1 75%, #ffd1a0 85%, #b57bff 95%, transparent);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
            mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
    animation: spin 6s linear infinite;
  }
  @keyframes spin { to { --a: 360deg; } }
  .step { animation: in .7s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes in { from { opacity: 0; transform: translateY(22px); filter: blur(8px); } }
  .chap { margin: 0 0 .8rem; font-size: .8rem; letter-spacing: .28em; text-transform: uppercase; color: rgba(255,255,255,.6); }
  h2 { margin: .2rem 0 .8rem; font-weight: 300; font-size: clamp(1.6rem, 6vw, 2.4rem); letter-spacing: .02em; }
  p { margin: .6rem 0; line-height: 1.55; font-size: clamp(1rem, 3.6vw, 1.15rem); color: rgba(255,255,255,.9); }
  .ph { width: 100%; max-height: 46vh; object-fit: cover; border-radius: 18px; box-shadow: 0 14px 40px rgba(0,0,0,.4); margin-bottom: .8rem; }
  .btn {
    display: inline-block; margin-top: .8rem; padding: .8rem 1.6rem; font: inherit; color: #fff; cursor: pointer; border: 0; border-radius: 999px;
    background: linear-gradient(135deg, #ff6f9f, #b57bff); box-shadow: 0 8px 30px rgba(255,105,160,.4); transition: transform .2s;
  }
  .btn:hover { transform: translateY(-2px); }
  .btn:disabled { opacity: .45; cursor: default; transform: none; }
  .opts { display: grid; gap: .6rem; margin: 1rem 0 .4rem; }
  .opt { padding: .85rem 1rem; font: inherit; color: #fff; cursor: pointer; border-radius: 14px; border: 1px solid rgba(255,255,255,.3); background: rgba(255,255,255,.08); }
  .opt:hover:not(:disabled) { background: rgba(255,255,255,.16); }
  .opt.ok { background: rgba(120,230,160,.3); border-color: #7ee6a8; }
  .opt.bad { animation: shake .4s; }
  @keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
  .hint { color: #ffc3d8; font-size: .95rem; }
  input, textarea {
    width: 100%; margin: .4rem 0; padding: .85rem 1rem; font: inherit; color: #fff; outline: none;
    background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.25); border-radius: 14px;
  }
  textarea { min-height: 110px; resize: vertical; }
  input:focus, textarea:focus { border-color: #ff8fb1; }
  .pz { display: grid; gap: 3px; margin: .8rem auto; width: 100%; touch-action: manipulation; }
  .pz div { background-repeat: no-repeat; border-radius: 6px; cursor: pointer; transition: transform .2s, box-shadow .2s; }
  .pz div.sel { transform: scale(.92); box-shadow: 0 0 0 3px #ff8fb1, 0 0 25px #ff8fb1; }
  .pz.done { gap: 0; pointer-events: none; }
  .pz.done div { border-radius: 0; }
  .heart { position: fixed; top: -2rem; z-index: 1; pointer-events: none; color: #ff8fb1; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(115vh) rotate(40deg); } }
  @media (prefers-reduced-motion: reduce) { .card::before, .step, .opt.bad, .heart { animation: none; } }
</style>
<link rel="stylesheet" href="fx.css">
<script src="fx.js"></script>
</head>
<body>
  <div class="aurora"></div>
  <div class="bar"><i id="fill"></i></div>
  <main>
    <section class="card" id="login" hidden>
      <h2>Два года ♥</h2>
      <form id="lf">
        <input type="email" id="em" placeholder="Почта" autocomplete="username" required>
        <input type="password" id="pw" placeholder="Пароль" autocomplete="current-password" required>
        <button class="btn" type="submit">Войти</button>
      </form>
      <p class="hint" id="err"></p>
    </section>
    <section class="card" id="card" hidden></section>
  </main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* ================= ИСТОРИЯ: правится только этот блок ================= */
const BUCKET = "story";   // приватный бакет с фотками 01.jpg, 02.jpg ...
const GRID = [3, 3];      // пазл: колонок, строк

// t: intro | photo | quiz | open | puzzle | finale.  ch: название главы (ставится на первом шаге главы)
const STORY = [
  { ch: "Глава I · Начало", t: "intro", title: "Два года", text: "[ТЕКСТ ВСТУПЛЕНИЯ]" },
  { t: "photo", file: "01.jpg", title: "[Название 1]", text: "[ИСТОРИЯ К ФОТО 1]" },
  { t: "photo", file: "02.jpg", title: "[Название 2]", text: "[ИСТОРИЯ К ФОТО 2]" },
  { ch: "Глава II · Наши моменты", t: "photo", file: "03.jpg", title: "[Название 3]", text: "[ИСТОРИЯ К ФОТО 3]" },
  { t: "photo", file: "04.jpg", title: "[Название 4]", text: "[ИСТОРИЯ К ФОТО 4]" },
  { ch: "Глава III · То, что знаем только мы", t: "quiz", file: "05.jpg",
    q: "[ВОПРОС]", opts: ["[Вариант А]", "[Вариант Б]", "[Вариант В]"], ok: 0,
    hint: "[подсказка]", text: "[ЧТО НА САМОМ ДЕЛЕ БЫЛО — показывается после верного ответа]" },
  { t: "quiz", file: "06.jpg", q: "[ВОПРОС 2]", opts: ["[А]", "[Б]", "[В]"], ok: 1, hint: "[подсказка]", text: "[ИСТОРИЯ]" },
  { t: "open", file: "07.jpg", q: "[ВОПРОС БЕЗ ПРАВИЛЬНОГО ОТВЕТА]" },
  { ch: "Глава IV · Собрать воспоминание", t: "puzzle", file: "08.jpg", text: "[ТЕКСТ, КОТОРЫЙ ПОЯВИТСЯ ПОСЛЕ СБОРКИ]" },
  { ch: "Глава V · Продолжение", t: "finale", lines: ["[СТРОКА 1]", "[СТРОКА 2]", "[ТВОЯ ФИНАЛЬНАЯ ФРАЗА]"] }
];
/* ====================================================================== */

const sb = supabase.createClient("https://cybozsjvdzzuxqwmyzku.supabase.co", "sb_publishable_vC4hZcyGeSY_30s5hox2TA_xvNMpLVt");
const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
let i = store.get("story_i", 0), answers = store.get("story_ans", {}), urls = {}, signedAt = 0;
if (/^#\d+$/.test(location.hash)) i = Math.min(+location.hash.slice(1), STORY.length - 1);   // #5 = перейти на шаг 5 (для тестов)

const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt !== undefined) e.textContent = txt; return e; };
const chapOf = n => { for (let k = n; k >= 0; k--) if (STORY[k].ch) return STORY[k].ch; return ""; };

// подписанные ссылки живут час, поэтому обновляем их при возврате на вкладку
async function sign() {
  const files = [...new Set(STORY.filter(s => s.file).map(s => s.file))];
  const r = await sb.storage.from(BUCKET).createSignedUrls(files, 3600);
  (r.data || []).forEach(u => { if (u.signedUrl) urls[u.path] = u.signedUrl; });
  signedAt = Date.now();
}
// пока фотки нет в бакете, вместо неё рисуется заглушка, так что всё можно тестировать заранее
function fallback(label) {
  const c = document.createElement("canvas"); c.width = 900; c.height = 600;
  const x = c.getContext("2d"), g = x.createLinearGradient(0, 0, 900, 600);
  g.addColorStop(0, "#ff6f9f"); g.addColorStop(.5, "#b57bff"); g.addColorStop(1, "#6c8cff");
  x.fillStyle = g; x.fillRect(0, 0, 900, 600);
  for (let k = 0; k < 12; k++) { x.beginPath(); x.arc((k * 173) % 900, (k * 251) % 600, 40 + k * 6, 0, 6.3); x.fillStyle = "rgba(255,255,255,.18)"; x.fill(); }
  x.fillStyle = "#fff"; x.font = "bold 64px sans-serif"; x.textAlign = "center"; x.fillText("♥ " + label, 450, 320);
  return c.toDataURL("image/jpeg", .8);
}
const src = f => urls[f] || fallback(f);

const go = n => { i = Math.max(0, Math.min(n, STORY.length - 1)); store.set("story_i", i); render(); };
const nextBtn = (label, fn) => { const b = el("button", "btn", label || "Дальше →"); b.onclick = fn || (() => go(i + 1)); return b; };

function render() {
  const s = STORY[i], card = $("card"), w = el("div", "step");
  $("fill").style.width = (i / (STORY.length - 1) * 100) + "%";
  card.replaceChildren(w);
  window.scrollTo(0, 0);
  w.appendChild(el("p", "chap", chapOf(i)));
  if (s.file && s.t !== "puzzle") { const im = el("img", "ph"); im.src = src(s.file); im.alt = ""; w.appendChild(im); }

  if (s.t === "intro" || s.t === "photo") {
    w.append(el("h2", "", s.title), el("p", "", s.text), nextBtn(s.t === "intro" ? "Начать" : ""));
  }
  else if (s.t === "quiz") {
    const txt = el("p", "", s.text || ""), hint = el("p", "hint", s.hint || ""), opts = el("div", "opts"), nb = nextBtn();
    txt.hidden = hint.hidden = nb.hidden = true;
    s.opts.forEach((o, k) => {
      const b = el("button", "opt", o);
      b.onclick = () => {
        if (k === s.ok) {
          b.classList.add("ok"); opts.querySelectorAll("button").forEach(x => x.disabled = true);
          hint.hidden = true; txt.hidden = !s.text; nb.hidden = false;
        } else { b.classList.remove("bad"); void b.offsetWidth; b.classList.add("bad"); hint.hidden = !s.hint; }
      };
      opts.appendChild(b);
    });
    w.append(el("h2", "", s.q), opts, hint, txt, nb);
  }
  else if (s.t === "open") {
    const ta = el("textarea"), nb = nextBtn("Сохранить и дальше →", () => { answers[i] = ta.value.trim(); store.set("story_ans", answers); go(i + 1); });
    ta.placeholder = "Напиши своими словами…"; ta.value = answers[i] || ""; nb.disabled = !ta.value.trim();
    ta.oninput = () => nb.disabled = !ta.value.trim();
    w.append(el("h2", "", s.q), ta, nb);
  }
  else if (s.t === "puzzle") { puzzle(s, w); }
  else if (s.t === "finale") {
    s.lines.forEach((l, k) => { const p = el("p", "", l); p.style.animation = "in 1s " + (.6 + k * 1.6) + "s both"; w.appendChild(p); });
    const again = nextBtn("Пройти заново", () => go(0)); again.style.animation = "in 1s " + (.6 + s.lines.length * 1.6) + "s both";
    w.appendChild(again); hearts();
  }
}

// пазл: нажми кусочек, потом место, куда его поставить (работает и пальцем, и мышкой)
function puzzle(s, w) {
  const [C, R] = GRID, im = new Image(), box = el("div", "pz"), txt = el("p", "", s.text || ""), nb = nextBtn();
  txt.hidden = nb.hidden = true;
  w.append(el("h2", "", "Собери воспоминание"), el("p", "hint", "Нажми на кусочек, потом на место, куда его поставить."), box, txt, nb);
  im.onload = () => {
    box.style.aspectRatio = im.naturalWidth + "/" + im.naturalHeight;
    box.style.gridTemplateColumns = "repeat(" + C + ",1fr)"; box.style.gridTemplateRows = "repeat(" + R + ",1fr)";
    const order = [...Array(C * R).keys()]; let sel = -1;
    do { order.sort(() => Math.random() - .5); } while (order.every((v, p) => v === p));
    const draw = () => {
      box.replaceChildren();
      order.forEach((t, p) => {
        const d = el("div", p === sel ? "sel" : "");
        d.style.backgroundImage = 'url("' + im.src + '")';
        d.style.backgroundSize = (C * 100) + "% " + (R * 100) + "%";
        d.style.backgroundPosition = ((t % C) * 100 / (C - 1)) + "% " + (Math.floor(t / C) * 100 / (R - 1)) + "%";
        d.onclick = () => tap(p);
        box.appendChild(d);
      });
    };
    const tap = p => {
      if (sel < 0) sel = p; else { if (sel !== p) [order[sel], order[p]] = [order[p], order[sel]]; sel = -1; }
      draw();
      if (order.every((v, q) => v === q)) { box.classList.add("done"); txt.hidden = false; nb.hidden = false; hearts(); }
    };
    draw();
  };
  im.src = src(s.file);
}

function hearts() {
  for (let k = 0; k < 28; k++) {
    const h = el("span", "heart", "♥");
    h.style.left = Math.random() * 100 + "vw"; h.style.fontSize = (14 + Math.random() * 22) + "px";
    h.style.animationDuration = (5 + Math.random() * 6) + "s"; h.style.animationDelay = Math.random() * 4 + "s";
    h.addEventListener("animationend", () => h.remove());
    document.body.appendChild(h);
  }
}

async function start() {
  const r = await sb.auth.getSession();
  if (!r.data.session) { $("login").hidden = false; $("card").hidden = true; return; }
  $("login").hidden = true; $("card").hidden = false;
  await sign(); render();
}
$("lf").addEventListener("submit", async e => {
  e.preventDefault(); $("err").textContent = "";
  const r = await sb.auth.signInWithPassword({ email: $("em").value.trim(), password: $("pw").value });
  if (r.error) $("err").textContent = "Не получилось войти: " + r.error.message; else start();
});
document.addEventListener("visibilitychange", async () => {
  if (!document.hidden && signedAt && Date.now() - signedAt > 45 * 60 * 1000) { await sign(); render(); }
});
start();
</script>
</body>
</html>
