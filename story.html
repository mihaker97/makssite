<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Два года ♥</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14102e">
<style>
  @property --a { syntax: "<angle>"; initial-value: 0deg; inherits: false; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; min-height: 100%; }
  body { color: #fff; background: #0d0b1f; font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; }
  .aurora { position: fixed; inset: 0; z-index: 0; background:
    radial-gradient(60vmax 60vmax at 15% 20%, rgba(255,105,160,.55), transparent 60%),
    radial-gradient(55vmax 55vmax at 85% 25%, rgba(108,140,255,.5), transparent 60%),
    radial-gradient(60vmax 60vmax at 60% 90%, rgba(181,123,255,.55), transparent 60%),
    linear-gradient(135deg, #14102e, #2a1650, #4a1f5e); }
  main { position: relative; z-index: 2; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.4rem 1.2rem calc(1.4rem + env(safe-area-inset-bottom)); }
  .card { position: relative; width: min(100%, 620px); border-radius: 28px; padding: 1.4rem; text-align: center; background: rgba(255,255,255,.07); box-shadow: 0 30px 80px rgba(0,0,0,.35); }
  .card::before { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1.5px; pointer-events: none;
    background: conic-gradient(from var(--a), transparent 0 55%, #ff8fb1 75%, #ffd1a0 85%, #b57bff 95%, transparent);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
            mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); animation: spin 6s linear infinite; }
  @keyframes spin { to { --a: 360deg; } }
  .step { animation: in .7s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes in { from { opacity: 0; transform: translateY(22px); filter: blur(8px); } }
  h2 { margin: .6rem 0; font-weight: 300; font-size: clamp(1.4rem, 5.5vw, 2.1rem); }
  p { margin: .6rem 0; line-height: 1.55; font-size: clamp(1rem, 3.6vw, 1.15rem); color: rgba(255,255,255,.92); }
  .hint { color: #ffc3d8; font-size: .95rem; }
  .pic { position: relative; display: flex; gap: 8px; justify-content: center; }
  .pic img, .hp img, .hero img { display: block; flex: 1; min-width: 0; width: 100%; max-height: 52vh; object-fit: cover; border-radius: 16px; box-shadow: 0 12px 36px rgba(0,0,0,.4); -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  .pic img.over { position: absolute; inset: 0; height: 100%; max-height: none; }
  .hp { display: grid; gap: 8px; margin-top: .8rem; } .hp img { max-height: none; }
  .hero { display: grid; grid-template-columns: 1fr 2.4fr 1fr; gap: 8px; align-items: center; }
  .hero .col { display: grid; gap: 8px; } .hero img { max-height: none; }
  .word { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; font-size: clamp(2rem, 10vw, 3.6rem); font-weight: 700; text-shadow: 0 4px 30px rgba(0,0,0,.7); animation: in .6s .2s both; }
  .btn { display: inline-block; margin: .8rem .3rem 0; padding: .8rem 1.6rem; font: inherit; color: #fff; cursor: pointer; border: 0; border-radius: 999px; background: linear-gradient(135deg, #ff6f9f, #b57bff); box-shadow: 0 8px 30px rgba(255,105,160,.4); }
  .btn.ghost { background: rgba(255,255,255,.14); box-shadow: none; }
  .btn:disabled { opacity: .45; }
  .opts { display: grid; gap: .6rem; margin: .8rem 0 .2rem; }
  .opt { padding: .85rem 1rem; font: inherit; color: #fff; cursor: pointer; border-radius: 14px; border: 1px solid rgba(255,255,255,.3); background: rgba(255,255,255,.08); }
  .opt.ok { background: rgba(120,230,160,.3); border-color: #7ee6a8; }
  .bad { animation: shake .4s; } @keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
  input, textarea { width: 100%; margin: .4rem 0; padding: .85rem 1rem; font: inherit; color: #fff; outline: none; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.25); border-radius: 14px; }
  textarea { min-height: 110px; resize: vertical; } input.okk { border-color: #7ee6a8; }
  .pz { display: grid; gap: 3px; margin: .8rem auto; width: 100%; touch-action: manipulation; }
  .pz div { background-repeat: no-repeat; border-radius: 6px; cursor: pointer; transition: transform .2s, box-shadow .2s; }
  .pz div.sel { transform: scale(.92); box-shadow: 0 0 0 3px #ff8fb1, 0 0 25px #ff8fb1; }
  .pz.done { gap: 0; pointer-events: none; } .pz.done div { border-radius: 0; }
  .big { font-size: clamp(1.15rem, 4.4vw, 1.5rem); }
  .huge { font-size: clamp(2.2rem, 10vw, 3.6rem); font-weight: 700; line-height: 1.15; background: linear-gradient(90deg, #ffd1e3, #ff8fb1, #ffc3a0); -webkit-background-clip: text; background-clip: text; color: transparent; }
  /* эффекты */
  .bit, .heart { position: fixed; pointer-events: none; }
  .bit { z-index: 60; animation: fly 1.4s cubic-bezier(.1,.7,.3,1) forwards; }
  @keyframes fly { to { transform: translate(var(--dx), calc(var(--dy) + 80px)) rotate(var(--r)); opacity: 0; } }
  .heart { top: -2rem; z-index: 1; color: #ff8fb1; animation: fall linear forwards; } @keyframes fall { to { transform: translateY(115vh) rotate(40deg); } }
  .ov { position: fixed; inset: 0; z-index: 55; display: grid; place-items: center; background: rgba(10,8,25,.78); animation: in .3s both; }
  .ic { grid-area: 1/1; width: min(60vmin, 320px); aspect-ratio: 1; border-radius: 22%; display: grid; place-items: center; font-size: min(34vmin, 180px); color: #fff; background: linear-gradient(135deg, #ff6f9f, #b57bff 55%, #6c8cff); box-shadow: 0 0 60px rgba(255,105,160,.6); }
  .ic.L { clip-path: polygon(0 0, 52% 0, 46% 22%, 54% 40%, 47% 62%, 53% 100%, 0 100%); animation: cl 3s .6s ease-in both; }
  .ic.R { clip-path: polygon(52% 0, 100% 0, 100% 100%, 53% 100%, 47% 62%, 54% 40%, 46% 22%); animation: cr 3s .6s ease-in both; }
  @keyframes cl { 0%, 10% { transform: none; } 20% { transform: translateX(-8px) rotate(-3deg); } 100% { transform: translate(-12vw, 130vh) rotate(-30deg); } }
  @keyframes cr { 0%, 10% { transform: none; } 20% { transform: translateX(8px) rotate(3deg); } 100% { transform: translate(12vw, 130vh) rotate(30deg); } }
  .ic.S { animation: hit 3s both; } @keyframes hit { 0%, 30% { transform: none; } 33% { transform: scale(.9) rotate(-4deg); } 42% { transform: scale(1.03) rotate(3deg); } 55%, 100% { transform: none; } }
  .bullet { grid-area: 1/1; justify-self: start; width: 48px; height: 12px; border-radius: 6px 999px 999px 6px; background: linear-gradient(90deg, #888, #fff); box-shadow: 0 0 14px #fff; animation: fire .5s .5s cubic-bezier(.5,0,1,1) both; }
  @keyframes fire { 0% { transform: translateX(-60px); } 99% { transform: translateX(calc(50vw - 24px)); opacity: 1; } 100% { transform: translateX(calc(50vw - 24px)); opacity: 0; } }
  .hole { grid-area: 1/1; width: 30px; height: 30px; border-radius: 50%; background: radial-gradient(#000 35%, #2a0a1a 62%, transparent 70%); animation: hl .1s 1s both; } @keyframes hl { from { transform: scale(0); } }
  .mt { position: fixed; left: 0; top: 0; width: min(86vw, 520px); height: 46px; border-radius: 999px; background: rgba(255,255,255,.15); border: 2px solid #fff; overflow: hidden; will-change: transform; }
  .mt i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, #ff6f9f, #b57bff); } .mt b { position: relative; display: block; line-height: 42px; font-size: 1.3rem; }
  .inf { font-size: clamp(5rem, 28vw, 12rem); font-weight: 700; line-height: 1; background: linear-gradient(90deg, #ffd1e3, #ff8fb1, #ffc3a0); -webkit-background-clip: text; background-clip: text; color: transparent; animation: in 1s both; }
  .ovc { grid-area: 1/1; text-align: center; }
  @media (prefers-reduced-motion: reduce) { .card::before, .step, .bad { animation: none; } }
</style>
<link rel="stylesheet" href="fx.css">
<script src="fx.js"></script>
</head>
<body>
<div class="aurora"></div>
<main>
  <section class="card" id="login" hidden>
    <h2>Два года ♥</h2>
    <form id="lf">
      <input type="email" id="em" placeholder="Почта" autocomplete="username" required>
      <input type="password" id="pw" placeholder="Пароль" autocomplete="current-password" required>
      <button class="btn" type="submit">Войти</button>
    </form>
    <p class="hint" id="err"></p>
  </section>
  <section class="card" id="card" hidden></section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// Тексты, вопросы и ответы лежат в приватном бакете (story.json), а не в публичном репозитории.
const BUCKET = "story";
const sb = supabase.createClient("https://cybozsjvdzzuxqwmyzku.supabase.co", "sb_publishable_vC4hZcyGeSY_30s5hox2TA_xvNMpLVt");
const $ = id => document.getElementById(id);
const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt !== undefined) e.textContent = txt; return e; };
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
let S = [], i = store.get("story_i", 0), urls = {}, signedAt = 0;
if (/^#\d+$/.test(location.hash)) i = +location.hash.slice(1);   // #5 = открыть шаг 5 (для тестов)

/* ---------- фотки ---------- */
function fb(n) {   // заглушка, если файла нет в бакете
  const c = document.createElement("canvas"); c.width = 900; c.height = 600;
  const x = c.getContext("2d"), g = x.createLinearGradient(0, 0, 900, 600);
  g.addColorStop(0, "#ff6f9f"); g.addColorStop(.5, "#b57bff"); g.addColorStop(1, "#6c8cff"); x.fillStyle = g; x.fillRect(0, 0, 900, 600);
  for (let k = 0; k < 12; k++) { x.beginPath(); x.arc((k * 173) % 900, (k * 251) % 600, 40 + k * 6, 0, 6.3); x.fillStyle = "rgba(255,255,255,.18)"; x.fill(); }
  x.fillStyle = "#fff"; x.font = "bold 64px sans-serif"; x.textAlign = "center"; x.fillText("♥ " + n, 450, 320);
  return c.toDataURL("image/jpeg", .8);
}
const img = (n, cls) => { const e = el("img", cls); e.src = urls[n + ".jpg"] || fb(n); e.alt = ""; e.draggable = false; return e; };
const pics = f => { const d = el("div", "pic"); (f || []).forEach(n => d.appendChild(img(n))); return d; };
async function sign() {   // ссылки живут час, поэтому обновляем их при возврате на вкладку
  const names = new Set();
  S.forEach(s => [...(s.f || []), ...(s.L || []), ...(s.R || []), ...(s.hint || []), s.C, s.rev, s.hold].forEach(n => n && names.add(n + ".jpg")));
  const r = await sb.storage.from(BUCKET).createSignedUrls([...names], 3600);
  (r.data || []).forEach(u => { if (u.signedUrl) urls[u.path] = u.signedUrl; });
  signedAt = Date.now();
}

/* ---------- эффекты ---------- */
function pop(x, y, n, ch, col) {   // конфетти / сердечки из точки
  const cs = ["#ff8fb1", "#ffd166", "#7ee6a8", "#6c8cff", "#b57bff", "#fff"];
  for (let k = 0; k < n; k++) {
    const p = el("span", "bit", ch[k % ch.length]), a = Math.random() * 6.283, d = 80 + Math.random() * Math.min(innerWidth, innerHeight) * .55;
    p.style.cssText = "left:" + x + "px;top:" + y + "px;color:" + (col ? cs[k % cs.length] : "#ff8fb1") + ";font-size:" + (12 + Math.random() * 18) + "px;--dx:" + Math.cos(a) * d + "px;--dy:" + Math.sin(a) * d + "px;--r:" + (Math.random() * 720 - 360) + "deg";
    p.onanimationend = () => p.remove(); document.body.appendChild(p);
  }
}
function hearts() {
  for (let k = 0; k < 28; k++) {
    const h = el("span", "heart", "♥");
    h.style.cssText = "left:" + Math.random() * 100 + "vw;font-size:" + (14 + Math.random() * 22) + "px;animation-duration:" + (5 + Math.random() * 6) + "s;animation-delay:" + Math.random() * 4 + "s";
    h.onanimationend = () => h.remove(); document.body.appendChild(h);
  }
}
const overlay = ms => { const o = el("div", "ov"); document.body.appendChild(o); if (ms) setTimeout(() => o.remove(), ms); return o; };
const brk = () => overlay(3300).append(el("div", "ic L", "♥"), el("div", "ic R", "♥"));                        // сердце раскалывается и падает
const shot = () => overlay(3400).append(el("div", "ic S", "♥"), el("div", "bullet"), el("div", "hole"));    // выстрел в центр сердца

/* ---------- шаги ---------- */
const go = n => { i = Math.max(0, Math.min(n, S.length - 1)); store.set("story_i", i); render(); };
const nextBtn = (label, fn) => { const b = el("button", "btn", label || "Дальше →"); b.onclick = fn || (() => go(i + 1)); return b; };

function render() {
  const s = S[i], w = el("div", "step");
  $("card").replaceChildren(w); scrollTo(0, 0);
  ({ hero, photo, quiz, open, meter, puzzle, final: fin })[s.t](s, w);
}

function hero(s, w) {   // по центру 37, остальные маленькие по бокам
  const g = el("div", "hero"), col = a => { const c = el("div", "col"); a.forEach(n => c.appendChild(img(n))); return c; };
  g.append(col(s.L), col([s.C]), col(s.R)); w.append(g, el("p", "", s.text), nextBtn());
}
function photo(s, w) { w.append(pics(s.f), el("p", "", s.text), nextBtn()); }

function quiz(s, w) {
  const pic = pics(s.f), nb = nextBtn(), hp = el("div", "hp"); let hb;
  nb.hidden = hp.hidden = true; (s.hint || []).forEach(n => hp.appendChild(img(n)));
  if (s.hold) {   // пока зажато фото, поверх показывается второе
    const h = img(s.hold, "over"); h.style.cssText = "opacity:0;transition:opacity .15s"; pic.appendChild(h);
    pic.onpointerdown = () => h.style.opacity = 1; pic.oncontextmenu = e => e.preventDefault();
    ["onpointerup", "onpointerleave", "onpointercancel"].forEach(e => pic[e] = () => h.style.opacity = 0);
  }
  w.append(pic, el("h2", "", s.q)); if (s.tip) w.appendChild(el("p", "hint", s.tip));
  if (s.hb) { hb = el("button", "btn ghost", "Подсказка"); hb.hidden = true; hb.onclick = () => { hp.hidden = false; hb.hidden = true; }; }
  const bad = node => { node.classList.remove("bad"); void node.offsetWidth; node.classList.add("bad"); if (s.hint) { if (hb) hb.hidden = !hp.hidden; else hp.hidden = false; } };
  const good = () => {
    nb.hidden = false;
    if (s.rev) {   // поверх фото появляется второе и слово «Правильно!», из него вылетает конфетти
      const r = img(s.rev, "over"), t = el("div", "word", "Правильно!"); pic.append(r, t);
      requestAnimationFrame(() => { const b = t.getBoundingClientRect(); pop(b.left + b.width / 2, b.top + b.height / 2, 60, ["■", "●", "▲", "♥"], 1); });
    }
  };
  if (s.o) {
    const box = el("div", "opts");
    s.o.map((t, k) => ({ t, k })).sort(() => Math.random() - .5).forEach(({ t, k }) => {
      const b = el("button", "opt", t);
      b.onclick = () => {
        if (s.ok === "all" || s.ok.includes(k)) { b.classList.add("ok"); box.querySelectorAll("button").forEach(x => x.disabled = true); good(); }
        else { if (s.fx && s.fx[k]) (s.fx[k] === "break" ? brk : shot)(); bad(b); }
      };
      box.appendChild(b);
    });
    w.appendChild(box);
  } else {   // ответ вводится текстом
    const inp = el("input"), ab = el("button", "btn", "Ответить"); inp.placeholder = "Твой ответ…";
    const check = () => {
      const v = inp.value.trim().toLowerCase().replace(/ё/g, "е"); if (!v) return;
      if (s.inp.includes(v)) { inp.disabled = ab.disabled = true; inp.classList.add("okk"); good(); } else bad(inp);
    };
    ab.onclick = check; inp.onkeydown = e => { if (e.key === "Enter") check(); }; w.append(inp, ab);
  }
  w.append(hb || "", hp, nb);
}

async function save(question, answer) {   // ответ уходит в Supabase, а если не вышло, ждёт в браузере и отправится позже
  const r = await sb.from("story_answers").insert({ question, answer });
  if (r.error) store.set("story_pend", [...store.get("story_pend", []), { question, answer }]);
}
async function flush() { const p = store.get("story_pend", []); if (p.length && !(await sb.from("story_answers").insert(p)).error) store.set("story_pend", []); }

function open(s, w) {
  const ta = el("textarea"), nb = nextBtn("Сохранить и дальше →", async () => { nb.disabled = true; await save(s.q, ta.value.trim()); go(i + 1); });
  ta.placeholder = "Напиши своими словами…"; nb.disabled = true; ta.oninput = () => nb.disabled = !ta.value.trim();
  w.append(pics(s.f), el("h2", "", s.q), ta, el("p", "hint", s.note || ""), nb);
}

function meter(s, w) {   // шкала: заполняется, выпрыгивает, отбивается от границ экрана, на 1000 взрыв сердечек
  const b = el("button", "btn", s.b); w.append(pics(s.f), el("h2", "", s.q), b);
  b.onclick = () => {
    b.disabled = true;
    const o = overlay(), m = el("div", "mt"), f = el("i"), t = el("b", "", "0%"); m.append(f, t); o.appendChild(m);
    const mw = m.offsetWidth, mh = m.offsetHeight; let v = 0, x = (innerWidth - mw) / 2, y = 16, vx = 0, vy = 0, out = false, last = performance.now();
    const tick = now => {
      const dt = Math.min(.05, (now - last) / 1000); last = now;
      if (!out) { v += dt * 40; if (v >= 100) { v = 100; out = true; vx = 300; vy = 200; m.style.boxShadow = "0 0 40px #ff8fb1"; } }
      else { v += dt * (100 + .3 * (v - 100)); const k = 1 + v / 500; x += vx * k * dt; y += vy * k * dt;
        if (x < 0) { x = 0; vx = Math.abs(vx); } if (x > innerWidth - mw) { x = innerWidth - mw; vx = -Math.abs(vx); }
        if (y < 0) { y = 0; vy = Math.abs(vy); } if (y > innerHeight - mh) { y = innerHeight - mh; vy = -Math.abs(vy); } }
      f.style.width = Math.min(v, 100) + "%"; t.textContent = Math.floor(v) + "%"; m.style.transform = "translate(" + x + "px," + y + "px)";
      if (v < 1000) return requestAnimationFrame(tick);
      const cx = x + mw / 2, cy = y + mh / 2; m.remove();
      [[cx, cy], [innerWidth * .2, innerHeight * .3], [innerWidth * .8, innerHeight * .3], [innerWidth / 2, innerHeight * .7]].forEach(p => pop(p[0], p[1], 40, ["♥"]));
      const c = el("div", "ovc"); c.append(el("div", "inf", "∞%"), nextBtn("Дальше →", () => { o.remove(); go(i + 1); })); o.appendChild(c);
    };
    requestAnimationFrame(tick);
  };
}

function puzzle(s, w) {   // нажми кусочек, потом место, куда его поставить
  const [C, R] = s.g, im = new Image(), box = el("div", "pz"), nb = nextBtn(); nb.hidden = true;
  w.append(el("h2", "", "Собери нашу фотку"), el("p", "hint", "Нажми на кусочек, потом на место, куда его поставить."), box, nb);
  im.onload = () => {
    box.style.aspectRatio = im.naturalWidth + "/" + im.naturalHeight;
    box.style.gridTemplateColumns = "repeat(" + C + ",1fr)"; box.style.gridTemplateRows = "repeat(" + R + ",1fr)";
    const order = [...Array(C * R).keys()]; let sel = -1;
    do { order.sort(() => Math.random() - .5); } while (order.every((v, p) => v === p));
    const draw = () => {
      box.replaceChildren();
      order.forEach((t, p) => {
        const d = el("div", p === sel ? "sel" : "");
        d.style.backgroundImage = 'url("' + im.src + '")'; d.style.backgroundSize = (C * 100) + "% " + (R * 100) + "%";
        d.style.backgroundPosition = ((t % C) * 100 / (C - 1)) + "% " + (Math.floor(t / C) * 100 / (R - 1)) + "%";
        d.onclick = () => tap(p); box.appendChild(d);
      });
    };
    const tap = p => {
      if (sel < 0) sel = p; else { if (sel !== p) [order[sel], order[p]] = [order[p], order[sel]]; sel = -1; }
      draw(); if (order.every((v, q) => v === q)) { box.classList.add("done"); nb.hidden = false; hearts(); }
    };
    draw();
  };
  im.src = urls[s.f[0] + ".jpg"] || fb(s.f[0]);
}

function fin(s, w) {
  const pic = pics(s.f), t = el("p", "big", s.text), h = el("div", "huge", s.big);
  pic.querySelector("img").style.maxHeight = "60vh"; t.style.animation = "in 1s .5s both"; h.style.animation = "in 1.2s 2s both";
  w.append(pic, t, h); hearts(); setTimeout(hearts, 3000);
}

/* ---------- запуск ---------- */
async function start() {
  const r = await sb.auth.getSession();
  if (!r.data.session) { $("login").hidden = false; $("card").hidden = true; return; }
  $("login").hidden = true; $("card").hidden = false;
  try {
    const u = await sb.storage.from(BUCKET).createSignedUrl("story.json", 120);
    if (u.error) throw u.error;
    S = await (await fetch(u.data.signedUrl)).json(); i = Math.min(i, S.length - 1);
    await sign(); render(); flush();
  } catch (e) { $("card").textContent = "Не получилось загрузить историю. Попробуй обновить страницу."; }
}
$("lf").addEventListener("submit", async e => {
  e.preventDefault(); $("err").textContent = "";
  const r = await sb.auth.signInWithPassword({ email: $("em").value.trim(), password: $("pw").value });
  if (r.error) $("err").textContent = "Не получилось войти: " + r.error.message; else start();
});
document.addEventListener("visibilitychange", async () => { if (!document.hidden && signedAt && Date.now() - signedAt > 45 * 60 * 1000) { await sign(); render(); } });
start();
</script>
